modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayTest="IGNORE_ALL_VERSION"
authors="TheonlyTazz; based on work by Sakura-Ryoko and contributors"
description='''Leave a server-side AFK replacement behind when you disconnect.'''
displayURL="https://github.com/TheonlyTazz/AFK-Unplug"
logoFile="assets/unplugged_afk/icon.png"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"
