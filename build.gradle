plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file("run-${minecraft_version}")
            if (providers.gradleProperty('autoConnect').isPresent()) {
                args '--quickPlayMultiplayer', 'localhost:25565'
            }
            property 'forge.logging.console.level', 'info'
            mods { unplugged_afk { source sourceSets.main } }
        }
        server {
            workingDirectory project.file("run-${minecraft_version}")
            args '--nogui'
            property 'forge.logging.console.level', 'info'
            mods { unplugged_afk { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'com.mojang:logging:1.2.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mixin {
    add sourceSets.main, 'unplugged_afk.refmap.json'
    config 'unplugged_afk.mixins.json'
}

tasks.named('test', Test) { useJUnitPlatform() }
tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }
tasks.named('jar', Jar) {
    from(rootProject.files('LICENSE', 'NOTICE')) { into 'META-INF' }
    manifest.attributes('MixinConfigs': 'unplugged_afk.mixins.json')
    finalizedBy 'reobfJar'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [minecraft_version_range: minecraft_version_range,
                 forge_version_range: forge_version_range, loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                 mod_version: mod_version]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
